아래 코드를 복사해서 `index.html`로 저장하면 돼.

```html
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>찬기를 위한 예지 퀴즈 💘</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#ffe4ed,#f4ddff);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#442743;padding:18px}
    .card{width:min(100%,440px);background:#fff;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 18px 45px #9e5c8b33}
    .tag{font-size:14px;font-weight:800;color:#a34882}.emoji{font-size:58px;margin:12px 0}h1{font-size:27px;margin:8px 0}p{line-height:1.5}.muted{color:#826b80}.top{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:#9a4382;margin-bottom:12px}
    .bar{height:10px;background:#f4e8f0;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;background:#f05b9e;transition:width .3s} .question{font-size:23px;font-weight:850;margin:30px 0 22px}
    button{border:0;cursor:pointer;font:inherit;font-weight:800;transition:transform .15s,background .15s}button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid #7135bd;outline-offset:3px}
    .primary{background:#ed579b;color:white;padding:15px 25px;border-radius:16px;width:100%;font-size:18px}.choice{display:block;width:100%;padding:17px;margin:12px 0;border-radius:16px;background:#fff0f7;color:#6a2855;border:2px solid #f6c9df;font-size:20px}.choice:hover{background:#ffe0ee}.choice.correct{background:#d8f7e5;border-color:#52bc83;color:#14663c}.choice.wrong{background:#ffe1e4;border-color:#e97984;color:#932d39}.choice:disabled{cursor:default;transform:none}.feedback{min-height:58px;font-size:18px;font-weight:800;margin:16px 0 7px}.hide{display:none}.small{font-size:13px;color:#967e92;margin-top:18px}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <section id="intro">
      <div class="tag">ONLY FOR 찬기 💌</div><div class="emoji">💖</div>
      <h1>예지에 대해 얼마나 알아?</h1>
      <p class="muted">2문제 · 제한 시간 30초<br>찬기의 예지력(?)을 보여줘!</p>
      <button class="primary" id="start">퀴즈 시작하기 ✨</button>
    </section>
    <section id="game" class="hide">
      <div class="top"><span id="progress">1 / 2</span><span id="timer">⏰ 30초</span></div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="emoji" id="icon">🍚</div>
      <div class="question" id="question"></div>
      <div id="choices"></div>
      <div class="feedback" id="feedback" role="status"></div>
      <button class="primary hide" id="next">다음 문제 ➜</button>
    </section>
    <section id="result" class="hide">
      <div class="emoji" id="resultIcon">💘</div><h1 id="resultTitle"></h1>
      <p id="resultText"></p><button class="primary" id="restart">다시 도전하기 🔁</button>
      <div class="small">정답: 간장게장 🦀 · 박찬기 💕</div>
    </section>
  </main>
  <script>
    const questions=[
      {text:'예지가 가장 좋아하는 음식은?',choices:['간장게장 🦀','카레 🍛'],answer:0,icon:'🍽️',right:'맞아! 간장게장 없으면 안 돼 🦀',wrong:'땡! 예지의 최애는 간장게장 🦀'},
      {text:'예지가 가장 좋아하는 사람은?',choices:['박찬기 💕','이재명'],answer:0,icon:'💘',right:'정답! 찬기 너야 💕',wrong:'에이~ 정답은 박찬기지 💕'}
    ];
    const $=id=>document.getElementById(id);
    let index=0,score=0,time=30,tick=null,locked=false;
    function show(id){['intro','game','result'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
    function start(){clearInterval(tick);index=0;score=0;time=30;locked=false;show('game');render();updateTime();tick=setInterval(()=>{time--;updateTime();if(time<=0)finish(true)},1000)}
    function updateTime(){$('timer').textContent=`⏰ ${time}초`;$('fill').style.width=`${time/30*100}%`}
    function render(){const q=questions[index];locked=false;$('progress').textContent=`${index+1} / ${questions.length}`;$('icon').textContent=q.icon;$('question').textContent=q.text;$('feedback').textContent='';$('next').classList.add('hide');$('choices').replaceChildren();q.choices.forEach((label,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>answer(i);$('choices').append(b)})}
    function answer(choice){if(locked)return;locked=true;const q=questions[index],correct=choice===q.answer;if(correct)score++;[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('feedback').textContent=correct?q.right:q.wrong;$('next').textContent=index===questions.length-1?'결과 보기 💌':'다음 문제 ➜';$('next').classList.remove('hide')}
    function finish(expired=false){clearInterval(tick);show('result');$('resultIcon').textContent=score===2?'🥰':'💌';$('resultTitle').textContent=expired?'시간 종료! ⏰':score===2?'예지 전문가 인증! 💯':`${score} / 2 정답!`;$('resultText').textContent=score===2?'역시 찬기, 예지를 아주 잘 아는구나 💕':expired?`30초 동안 ${score}개 맞혔어. 다시 도전해봐!`:'한 번 더 풀면 예지 박사 가능! 😆'}
    $('start').onclick=start;$('restart').onclick=start;$('next').onclick=()=>{if(index<questions.length-1){index++;render()}else finish()};
  </script>
</body>
</html>
```
